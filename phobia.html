<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>VR Exposure Therapy — Template</title>
  <script src="aframe/aframe-v1.7.1.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #help-top {
      position: fixed; left: 10px; top: 10px; z-index: 99998;
      color: #fff; font-size: 12px; line-height: 1.4; max-width: 260px;
      background: rgba(0,0,0,0.45); padding: 8px 10px; border-radius: 6px;
      pointer-events: none; font-family: system-ui, sans-serif;
    }
    #scene-label {
      position: fixed; right: 10px; top: 10px; z-index: 99998;
      color: #fff; font-size: 12px; background: rgba(0,0,0,0.45);
      padding: 6px 10px; border-radius: 6px; pointer-events: none;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="help-top">
    Desktop: click a button. Phone: tap a button.<br />
    VR headset (no controller): the black dot is where you're looking —
    rest it on a button and hold still; a ring fills up, then it activates.
  </div>
  <div id="scene-label"></div>

  <!--
    NOTE ON HARDWARE VOLUME BUTTONS:
    Regular mobile browsers do NOT expose phone hardware volume-button
    presses to web pages (the OS intercepts them for system volume, and
    browsers do this deliberately for security/UX reasons). There is no
    reliable, standards-based way to wire "phone volume button" -> "in-VR
    action" from a normal web page. Gaze-dwell selection (implemented
    below) is the standard, working substitute for a Cardboard-style
    headset that has no controller and no reachable touchscreen once the
    phone is inside the viewer. See docs/DEVELOPER.md for more detail
    and for an optional, best-effort experimental hook you can enable.
  -->

  <a-scene embedded>
    <a-assets timeout="10000">
      <!--
        Only ONE reusable <video> tag lives here. Whichever scene is
        currently a video (see SCENE_MEDIA near the top of the <script>
        block below) has its file loaded into this element at runtime.
        Image scenes are set directly on <a-sky src="..."> and don't
        need anything declared here.
      -->
      <video id="activeVideo" crossorigin="anonymous" preload="auto"
             playsinline webkit-playsinline loop="true" muted></video>

      <!--
        Music-toggle 3D icon (a .glb model). If your file has a
        different name/path, change the src below — that's the only
        place it's referenced by filename. Its on-screen size is set
        in the script (MUSIC_BUTTON_MODEL_SCALE), not here.
      -->
      <a-asset-item id="musicIconModel" src="3DModels/music-20.glb"></a-asset-item>
    </a-assets>

    <a-sky id="sky" rotation="0 -90 0"></a-sky>
    <a-videosphere id="videoSphere" visible="false" rotation="0 -90 0"></a-videosphere>

    <!-- Big 3D buttons that live "in" the current 360 scene. -->
    <a-entity id="hotspot-container"></a-entity>

    <!-- Small persistent navigation buttons (see CORNER_BUTTON_* settings). -->
    <a-entity id="corner-container"></a-entity>

    <a-entity id="cameraRig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0" look-controls="pointerLockEnabled: false">
        <!-- Always-visible gaze reticle: small black dot at screen center. -->
        <a-circle id="gazeDot" position="0 0 -0.6" radius="0.006"
                  material="color:#000; opacity:0.85; shader:flat; side: double"></a-circle>
        <!-- Progress ring: hidden until the dot rests on a button, then fills up. -->
        <a-ring id="gazeLoader" position="0 0 -0.6" radius-inner="0.03" radius-outer="0.045"
                material="color: #fff; opacity: 0.95; shader: flat; side: double"
                visible="false" scale="0.001 0.001 0.001"></a-ring>
        <a-cursor id="cameraCursor" rayOrigin="camera" fuse="false"
                  material="color: #fff; opacity: 0.0" raycaster="objects: .clickable"></a-cursor>
        <a-cursor id="mouseCursor" rayOrigin="mouse" fuse="false"
                  material="color: #fff; opacity: 0.0" raycaster="objects: .clickable"></a-cursor>
      </a-camera>
    </a-entity>
  </a-scene>

  <!-- Reusable background-music element for image scenes; see SCENE_MEDIA. -->
  <audio id="sceneMusic" preload="auto" loop></audio>

<script>
  /* ========================================================================
   * ⚙️ 1. CONTENT SETTINGS — put your real file paths here
   *
   * One entry per scene, keyed by the same ids used in PHOBIAS / CALM_PLACES
   * further down (don't rename the keys, just change the values).
   *
   *   src   -> path to that scene's 360° file — image OR video, either is
   *            fine in the same field. The code decides which one it is by
   *            looking at the file extension (see isVideoSrc() below) —
   *            you never need to say "this one is a video" yourself.
   *            Recognized video extensions: .mp4 .webm .mov .m4v
   *            Anything else (.jpg .jpeg .png .webp ...) is treated as an
   *            image.
   *   music -> (images only) path to a background-music file that loops
   *            for as long as that scene is shown, and shows the little
   *            music on/off button (see setting 4 below) when set.
   *            Set to null for no music. Video scenes ignore this field —
   *            if a video needs sound, put the sound in the video file
   *            itself.
   *
   * Currently wired to real content: 2 videos (acrophobia-harsh,
   * claustrophobia-harsh) and 8 images, with music on 5 of the image
   * scenes.
   * ====================================================================== */
  const SCENE_MEDIA = {
    // kenophobia or liminophobia ==> abondoned or empty places
    'kenophobia-mild':   { src: 'Images/kenophobia_mild_peppermint_powerplant.jpg', music: 'Sounds/kenophobia_mild.mp3' },
    'kenophobia-harsh':  { src: 'Images/kenophobia_harsh.jpg', music: "Sounds/kenophobia_harsh_haunted-mansion-echo-ambiance.mp3" },

    // acrophobia ==> height
    'acrophobia-mild':
    {
      src: 'Images/acrophobia_mild_sunset_jhbcentral.jpg',
      music: 'Sounds/acrophibia_mild_521696__podcapocalipsis__wind-blowing.mp3'
    },
    'acrophobia-harsh':
    {
      src: 'Videos/acrophobia_walk_the_tight_rope_360_video_jtazmfcuq90_e2442560.mp4',
      music: null
    },

    // claustrophobia ==> tight places
    'claustrophobia-mild':
    {
      src: 'Images/claustrophobia_mild.png',
      music: null //'Sounds/sample-music.mp3'
    },
    'claustrophobia-harsh':
    {
      src: 'Videos/claustrophobia_harsh_output.mp4',
      music: null
    },

    // mysophobia or germophobia ==> dirty places
    'mysophobia-mild':   { src: 'Images/mysophobia_mild_Grok.jpg', music: null },
    'mysophobia-harsh':  { src: 'Images/mysophobia_harsh_panorama-generator-bfc9bc2e-8203-4566-87d7-75fb7a238a71.png', music: null },

    // calming safe places
    'calm-garden':           { src: 'Images/calm_forest_lauter_waterfall.jpg', music: 'Sounds/garden_jungle-nature.mp3' },
    'beach-retreat':         { src: 'Images/calm_beach_spiaggia_di_mondello_2k.jpg', music: "Sounds/calm_beach-atmosphere.mp3" }
  };

  // Backgrounds for the two non-therapy "menu" scenes (Home, and every
  // phobia's overview page). These are not part of the 10 scenes above —
  // they're just the menu backdrop — but you can point them at your own
  // images too. Must be images (menu pages don't support video).
  const HOME_BACKGROUND_IMAGE = 'Images/sample.jpg';
  const PHOBIA_PAGE_BACKGROUND_IMAGE = 'Images/sample.jpg';

  const VIDEO_EXTENSIONS = ['.mp4', '.webm', '.mov', '.m4v'];
  function isVideoSrc(src) {
    const lower = String(src).toLowerCase();
    return VIDEO_EXTENSIONS.some((ext) => lower.endsWith(ext));
  }

  /* ========================================================================
   * ⚙️ 2. BUTTON LAYOUT SETTINGS — adjust here
   *
   * All positions are "x y z" strings in meters, world space. The camera
   * sits at CAMERA_EYE_HEIGHT looking straight down -Z by default, so:
   *   - a bigger Y  = the user looks UP to find it
   *   - a smaller Y = the user looks DOWN to find it
   *   - a more negative Z = further away from the user
   *
   * MAIN buttons = the 4 big buttons on the Home page and each phobia's
   * overview page. CORNER buttons = the small persistent nav buttons on
   * phobia pages / phobia scenes / calm scenes, placed higher up (see
   * previous notes) so the user glances up on purpose to find them.
   * ====================================================================== */
  const CAMERA_EYE_HEIGHT = 1.6; // must match the a-camera position="0 X 0" above

  const MAIN_BUTTON_Z = -2.2;
  const MAIN_BUTTON_TOP_Y = 1.3;      // top row of the 4 main buttons
  const MAIN_BUTTON_BOTTOM_Y = 0.3;   // bottom row of the 4 main buttons
  const MAIN_BUTTON_X_OFFSET = 1.6;   // left/right spread of the 4 main buttons
  const MAIN_BUTTON_WIDTH = 1.5;
  const MAIN_BUTTON_HEIGHT = 0.42;

  const MAIN_BUTTON_POSITIONS = [
    `-${MAIN_BUTTON_X_OFFSET} ${MAIN_BUTTON_TOP_Y} ${MAIN_BUTTON_Z}`,
    `${MAIN_BUTTON_X_OFFSET} ${MAIN_BUTTON_TOP_Y} ${MAIN_BUTTON_Z}`,
    `-${MAIN_BUTTON_X_OFFSET} ${MAIN_BUTTON_BOTTOM_Y} ${MAIN_BUTTON_Z}`,
    `${MAIN_BUTTON_X_OFFSET} ${MAIN_BUTTON_BOTTOM_Y} ${MAIN_BUTTON_Z}`
  ];

  const CORNER_BUTTON_Z = MAIN_BUTTON_Z;   // same depth/logic as main buttons
  const CORNER_BUTTON_TOP_Y = 2.0;         // top row of corner buttons (above main buttons)
  const CORNER_BUTTON_BOTTOM_Y = 1.6;      // 2nd row, only used when a scene has 4 corner buttons
  const CORNER_BUTTON_X_OFFSET = 1.1;      // left/right spread of corner buttons
  const CORNER_BUTTON_WIDTH = 1.0;
  const CORNER_BUTTON_HEIGHT = 0.34;

  const CORNER_BUTTON_POSITIONS_4 = [
    `-${CORNER_BUTTON_X_OFFSET} ${CORNER_BUTTON_TOP_Y} ${CORNER_BUTTON_Z}`,
    `${CORNER_BUTTON_X_OFFSET} ${CORNER_BUTTON_TOP_Y} ${CORNER_BUTTON_Z}`,
    `-${CORNER_BUTTON_X_OFFSET} ${CORNER_BUTTON_BOTTOM_Y} ${CORNER_BUTTON_Z}`,
    `${CORNER_BUTTON_X_OFFSET} ${CORNER_BUTTON_BOTTOM_Y} ${CORNER_BUTTON_Z}`
  ];
  // Used on phobia pages (single "Home" button) and calm scenes (single
  // "Back to ..." button) — placed top-right, level with the top corner row.
  const CORNER_BUTTON_POSITION_SINGLE = `${CORNER_BUTTON_X_OFFSET} ${CORNER_BUTTON_TOP_Y} ${CORNER_BUTTON_Z}`;

  const GAZE_TIME_MS = 1500;

  /* ========================================================================
   * ⚙️ 3. BUTTON APPEARANCE SETTINGS — adjust here
   *
   * Buttons are drawn as a smooth curved oval (not a sharp-cornered
   * rectangle), and every button always turns to face wherever the camera
   * currently is (an A-Frame "look-at" billboard) — so up close each one
   * reads like a small curved panel on the inside of the scene's sphere,
   * rather than a flat card stuck in space.
   *
   *   - MAIN_BUTTON_OPACITY / CORNER_BUTTON_OPACITY: 0 = fully see-through,
   *     1 = fully solid. Both default to ~50% so the 360° scene stays
   *     visible through the buttons.
   *   - BUTTON_CIRCLE_SEGMENTS: higher = smoother curve on the button's
   *     edge (more geometry). 64 is already very smooth; lower it (e.g.
   *     24) if you need better performance on an older phone.
   *   - Every *_COLOR value below is deliberately dark/muted so buttons
   *     don't glow against the scene — change any hex value to taste,
   *     they don't need to relate to each other. Per-phobia main-button
   *     colors live on each entry in PHOBIAS further down (the "color"
   *     field) instead of here.
   * ====================================================================== */
  const MAIN_BUTTON_OPACITY = 0.6;
  const CORNER_BUTTON_OPACITY = 0.5;
  const BUTTON_CIRCLE_SEGMENTS = 64;

  const MAIN_COLOR_HARSH  = '#5c1620'; // "Harsh scene" button on every phobia page
  const MAIN_COLOR_CALM_1 = '#1f4e63'; // "Calm place 1" button on every phobia page
  const MAIN_COLOR_CALM_2 = '#1f5c4d'; // "Calm place 2" button on every phobia page

  const CORNER_COLOR_HOME        = '#202020'; // "Home" corner button
  const CORNER_COLOR_PHOBIA_PAGE = '#12324a'; // "back to this phobia's page" corner button
  const CORNER_COLOR_CALM_1      = MAIN_COLOR_CALM_1; // reuses the calm-1 color above
  const CORNER_COLOR_CALM_2      = MAIN_COLOR_CALM_2; // reuses the calm-2 color above
  const CORNER_COLOR_BACK        = '#202020'; // "Back to <phobia>" button on calm scenes

  /* ========================================================================
   * ⚙️ 4. MUSIC TOGGLE BUTTON SETTINGS — adjust here
   *
   * A small clickable/gazeable 3D model (see the musicIconModel asset
   * above) that plays/pauses the current scene's music. It only appears
   * on phobia scenes and calm scenes whose SCENE_MEDIA entry has a
   * non-null "music" — scenes with no music get no button.
   * ====================================================================== */
  const MUSIC_BUTTON_MODEL_SCALE = 0.2; // resize the .glb model here if it looks too big/small
  const MUSIC_BUTTON_OFFSET_X = 0.75;    // horizontal gap from the nearby Home/Back corner button

  /* ========================================================================
   * CONTENT DATA — phobia names, colors, and info text.
   * (media addresses live in SCENE_MEDIA above, not here)
   * ====================================================================== */
  const PHOBIAS = {
    kenophobia: {
      id: 'kenophobia',
      name: 'Kenophobia',
      color: '#4a4a4a',
      info: 'Face the fear of empty or abandoned places.',
      mild:  { id: 'kenophobia-mild',  name: 'Mild scene' },
      harsh: { id: 'kenophobia-harsh', name: 'Harsh scene' },
      calm1: 'jungle',
      calm2: 'beach'
    },
    acrophobia: {
      id: 'acrophobia',
      name: 'Acrophobia',
      color: '#7a4a12',
      info: 'Face the fear of heights.',
      mild:  { id: 'acrophobia-mild',  name: 'Mild scene' },
      harsh: { id: 'acrophobia-harsh', name: 'Harsh scene' },
      calm1: 'jungle',
      calm2: 'beach'
    },
    claustrophobia: {
      id: 'claustrophobia',
      name: 'Claustrophobia',
      color: '#2f6b3a',
      info: 'Face the fear of tight or enclosed spaces.',
      mild:  { id: 'claustrophobia-mild',  name: 'Mild scene' },
      harsh: { id: 'claustrophobia-harsh', name: 'Harsh scene' },
      calm1: 'jungle',
      calm2: 'beach'
    },
    mysophobia: {
      id: 'mysophobia',
      name: 'Mysophobia',
      color: '#5c5c1f',
      info: 'Face the fear of germs or contamination.',
      mild:  { id: 'mysophobia-mild',  name: 'Mild scene' },
      harsh: { id: 'mysophobia-harsh', name: 'Harsh scene' },
      calm1: 'jungle',
      calm2: 'beach'
    }
  };

  const CALM_PLACES = {
    'jungle': {
      id: 'jungle',
      name: 'Jungle',
      info: ''
    },
    'beach': {
      id: 'beach-',
      name: 'Beach',
      info: ''
    }
  };

  const PHOBIA_ORDER = ['kenophobia', 'acrophobia', 'claustrophobia', 'mysophobia'];

  /* ======================================================================
   * DOM / A-FRAME REFERENCES
   * ==================================================================== */

  const sky = document.getElementById('sky');
  const videoSphere = document.getElementById('videoSphere');
  const activeVideo = document.getElementById('activeVideo');
  const sceneMusic = document.getElementById('sceneMusic');
  const hotspotContainer = document.getElementById('hotspot-container');
  const cornerContainer = document.getElementById('corner-container');
  const gazeLoader = document.getElementById('gazeLoader');
  const sceneLabel = document.getElementById('scene-label');

  const state = {
    activeScene: 'home',
    returnToPhobia: null // which phobia page a calm scene should return to
  };

  let gazeState = { active: false, start: 0, raf: null, onComplete: null };

  /* ======================================================================
   * BACKGROUND (image sky vs 360 video) + MUSIC HELPERS
   * ==================================================================== */

  function stopSceneMusic() {
    sceneMusic.pause();
  }

  function startSceneMusic(src) {
    if (!src) return;
    if (sceneMusic.getAttribute('src') !== src) {
      sceneMusic.setAttribute('src', src);
    }
    sceneMusic.currentTime = 0;
    sceneMusic.play().catch(() => {
      // Autoplay-with-sound can still be blocked by the browser on the
      // very first scene shown automatically on load (no user gesture
      // yet). Every later call happens inside a button click, which
      // counts as a user gesture and should play normally.
    });
  }

  function toggleSceneMusic() {
    if (sceneMusic.paused) {
      sceneMusic.play().catch(() => {});
    } else {
      sceneMusic.pause();
    }
  }

  // mediaEntry: { src, music? } — src's extension decides image vs video.
  function setBackgroundFromScene(mediaEntry) {
    stopSceneMusic();
    activeVideo.pause();

    if (mediaEntry && isVideoSrc(mediaEntry.src)) {
      sky.setAttribute('visible', 'false');
      if (activeVideo.getAttribute('src') !== mediaEntry.src) {
        activeVideo.setAttribute('src', mediaEntry.src);
      }
      videoSphere.setAttribute('src', '#activeVideo');
      videoSphere.setAttribute('visible', 'true');
      activeVideo.muted = true; // autoplay reliability; unmute once you've tested your real footage
      activeVideo.currentTime = 0;
      activeVideo.play().catch(() => {});
      return;
    }

    videoSphere.setAttribute('visible', 'false');
    const assetSrc = mediaEntry ? mediaEntry.src : HOME_BACKGROUND_IMAGE;
    sky.setAttribute('src', assetSrc);
    sky.setAttribute('visible', 'true');

    if (mediaEntry && mediaEntry.music) {
      startSceneMusic(mediaEntry.music);
    }
  }

  /* ======================================================================
   * UI TEARDOWN
   * ==================================================================== */

  function clearHotspots() {
    while (hotspotContainer.firstChild) hotspotContainer.removeChild(hotspotContainer.firstChild);
  }

  function clearCornerButtons() {
    while (cornerContainer.firstChild) cornerContainer.removeChild(cornerContainer.firstChild);
  }

  /* ======================================================================
   * TEXT PANEL HELPER
   * ==================================================================== */

  function addTextBlock({ x = 0, y = 0, z = -2.4, width = 1.8, color = '#fff', text }) {
    const entity = document.createElement('a-entity');
    entity.setAttribute('position', `${x} ${y} ${z}`);
    entity.setAttribute('text', `value:${text}; width:${width}; align:center; color:${color}; wrapCount:30; shader:msdf`);
    return entity;
  }

  /* ======================================================================
   * GAZE (dwell-to-click) HELPERS
   * ==================================================================== */

  function showLoader() {
    gazeLoader.setAttribute('visible', 'true');
    gazeLoader.setAttribute('scale', '0.001 0.001 0.001');
  }

  function hideLoader() {
    gazeLoader.setAttribute('visible', 'false');
  }

  function updateLoader(progress) {
    const minScale = 0.001;
    const scale = minScale + progress * (1 - minScale);
    gazeLoader.setAttribute('scale', `${scale} ${scale} ${scale}`);
  }

  function cancelGaze() {
    if (!gazeState.active) return;
    gazeState.active = false;
    gazeState.onComplete = null;
    if (gazeState.raf) {
      cancelAnimationFrame(gazeState.raf);
      gazeState.raf = null;
    }
    hideLoader();
  }

  function startGaze(onComplete) {
    cancelGaze();
    gazeState.active = true;
    gazeState.start = performance.now();
    gazeState.onComplete = onComplete;
    showLoader();

    const tick = (now) => {
      if (!gazeState.active) return;
      const progress = Math.min(1, (now - gazeState.start) / GAZE_TIME_MS);
      updateLoader(progress);

      if (progress >= 1) {
        gazeState.active = false;
        hideLoader();
        const cb = gazeState.onComplete;
        gazeState.onComplete = null;
        if (cb) cb();
        return;
      }
      gazeState.raf = requestAnimationFrame(tick);
    };
    gazeState.raf = requestAnimationFrame(tick);
  }

  /* ======================================================================
   * BUTTON FACTORIES
   *  - makeMainButton: big curved button placed inside the current 360 scene.
   *  - makeCornerButton: small persistent nav button, same in-scene
   *    placement logic, positioned higher (see CORNER_BUTTON_* settings).
   *  - makeMusicToggleButton: small 3D model button that plays/pauses the
   *    current scene's music.
   * All work with mouse click, touch tap, AND VR gaze-dwell, and all
   * billboard to face the camera (see setting 3 above).
   * ==================================================================== */

  function wireInteractions(bg, onClick) {
    bg.classList.add('clickable');
    const trigger = () => { if (typeof onClick === 'function') onClick(); };
    bg.addEventListener('click', trigger);                       // mouse + touch tap
    bg.addEventListener('mouseenter', () => startGaze(trigger));  // gaze dwell
    bg.addEventListener('mouseleave', cancelGaze);
    return trigger;
  }

  // Shared smooth, curved, translucent background disc used by both
  // button factories below — see "BUTTON APPEARANCE SETTINGS" (3) above.
  function makeButtonBackground({ width, height, color, opacity }) {
    const bg = document.createElement('a-entity');
    bg.setAttribute('geometry', `primitive: circle; radius: 0.5; segments: ${BUTTON_CIRCLE_SEGMENTS}`);
    bg.setAttribute('scale', `${width} ${height} 1`);
    bg.setAttribute('material', `color: ${color}; opacity: ${opacity}; shader: flat; side: double`);
    return bg;
  }

  function makeMainButton({ id, label, color, position, onClick }) {
    const wrapper = document.createElement('a-entity');
    wrapper.setAttribute('id', id);
    wrapper.setAttribute('position', position);
    wrapper.setAttribute('look-at', '#camera'); // always faces the user

    const bg = makeButtonBackground({
      width: MAIN_BUTTON_WIDTH, height: MAIN_BUTTON_HEIGHT,
      color, opacity: MAIN_BUTTON_OPACITY
    });

    const text = document.createElement('a-entity');
    text.setAttribute('position', '0 0 0.02');
    text.setAttribute('text', `value:${label}; align:center; width:${MAIN_BUTTON_WIDTH * 0.75}; color:#fff; wrapCount:16; shader:msdf`);

    wireInteractions(bg, onClick);
    wrapper.appendChild(bg);
    wrapper.appendChild(text);
    hotspotContainer.appendChild(wrapper);
    return wrapper;
  }

  function makeCornerButton({ id, label, position, color = CORNER_COLOR_HOME, onClick }) {
    const wrapper = document.createElement('a-entity');
    wrapper.setAttribute('id', id);
    wrapper.setAttribute('position', position);
    wrapper.setAttribute('look-at', '#camera'); // always faces the user

    const bg = makeButtonBackground({
      width: CORNER_BUTTON_WIDTH, height: CORNER_BUTTON_HEIGHT,
      color, opacity: CORNER_BUTTON_OPACITY
    });

    const text = document.createElement('a-entity');
    text.setAttribute('position', '0 0 0.02');
    text.setAttribute('text', `value:${label}; align:center; width:${CORNER_BUTTON_WIDTH * 0.7}; color:#fff; wrapCount:14; shader:msdf`);

    wireInteractions(bg, onClick);
    wrapper.appendChild(bg);
    wrapper.appendChild(text);
    cornerContainer.appendChild(wrapper);
    return wrapper;
  }

  // Small 3D music on/off button. hitArea is the actual clickable/gazeable
  // target (a generous, invisible circle) with the visible .glb model
  // sitting just in front of it — this keeps clicking/gazing reliable
  // even before the model has finished loading.
  function makeMusicToggleButton({ id, position }) {
    const wrapper = document.createElement('a-entity');
    wrapper.setAttribute('id', id);
    wrapper.setAttribute('position', position);
    wrapper.setAttribute('look-at', '#camera');

    const hitArea = document.createElement('a-circle');
    hitArea.setAttribute('radius', '0.22');
    hitArea.setAttribute('material', 'opacity: 0.001; shader: flat; side: double');
    wireInteractions(hitArea, toggleSceneMusic);

    const model = document.createElement('a-entity');
    model.setAttribute('gltf-model', '#musicIconModel');
    model.setAttribute('position', '0 0 0.02');
    model.setAttribute('scale', `${MUSIC_BUTTON_MODEL_SCALE} ${MUSIC_BUTTON_MODEL_SCALE} ${MUSIC_BUTTON_MODEL_SCALE}`);

    wrapper.appendChild(hitArea);
    wrapper.appendChild(model);
    cornerContainer.appendChild(wrapper);
    return wrapper;
  }

  // Music button sits just outside whichever "Home"-type corner button is
  // present in the current scene (see setting 4 above for the gap size).
  function musicButtonPositionNearHome4() {
    // The 4-corner-button layout's Home button is CORNER_BUTTON_POSITIONS_4[0]
    // (top-left) — put the music toggle further out to its left.
    return `-${CORNER_BUTTON_X_OFFSET + MUSIC_BUTTON_OFFSET_X} ${CORNER_BUTTON_TOP_Y} ${CORNER_BUTTON_Z}`;
  }

  function musicButtonPositionNearSingle() {
    // The single corner button (phobia-page Home / calm-scene Back) sits at
    // CORNER_BUTTON_POSITION_SINGLE (top-right) — put the music toggle
    // further out to its right.
    return `${CORNER_BUTTON_X_OFFSET + MUSIC_BUTTON_OFFSET_X} ${CORNER_BUTTON_TOP_Y} ${CORNER_BUTTON_Z}`;
  }

  /* ======================================================================
   * SCENE RENDER FUNCTIONS
   * ==================================================================== */

  function renderHome() {
    state.activeScene = 'home';
    state.returnToPhobia = null;
    sceneLabel.textContent = 'Home';
    clearHotspots();
    clearCornerButtons();
    setBackgroundFromScene({ src: HOME_BACKGROUND_IMAGE });

    hotspotContainer.appendChild(addTextBlock({
      x: 0, y: 2.6, z: -2.8, width: 2.4,
      text: 'VR Exposure Therapy\nChoose a phobia to begin'
    }));

    hotspotContainer.appendChild(addTextBlock({
      x: 0, y: 2.05, z: -2.7, width: 2.0, color: '#dfeaff',
      text: 'TODO: project description for participants goes here.'
    }));

    PHOBIA_ORDER.forEach((phobiaId, index) => {
      const phobia = PHOBIAS[phobiaId];
      makeMainButton({
        id: `home-${phobia.id}`,
        label: phobia.name,
        color: phobia.color,
        position: MAIN_BUTTON_POSITIONS[index],
        onClick: () => renderPhobiaPage(phobiaId)
      });
    });
    // Home has no corner buttons — there is nowhere "back" to go from here.
  }

  function renderPhobiaPage(phobiaId) {
    const phobia = PHOBIAS[phobiaId];
    if (!phobia) return;

    state.activeScene = `phobia-page:${phobiaId}`;
    sceneLabel.textContent = `${phobia.name} — overview`;
    clearHotspots();
    clearCornerButtons();
    setBackgroundFromScene({ src: PHOBIA_PAGE_BACKGROUND_IMAGE });

    hotspotContainer.appendChild(addTextBlock({
      x: 0, y: 2.6, z: -2.8, width: 2.4,
      text: `${phobia.name}\n${phobia.info}`
    }));

    const actions = [
      { label: phobia.mild.name,  color: phobia.color,   onClick: () => renderPhobiaScene(phobiaId, 'mild') },
      { label: phobia.harsh.name, color: MAIN_COLOR_HARSH, onClick: () => renderPhobiaScene(phobiaId, 'harsh') },
      { label: CALM_PLACES[phobia.calm1].name, color: MAIN_COLOR_CALM_1, onClick: () => renderCalmScene(phobia.calm1, phobiaId) },
      { label: CALM_PLACES[phobia.calm2].name, color: MAIN_COLOR_CALM_2, onClick: () => renderCalmScene(phobia.calm2, phobiaId) }
    ];

    actions.forEach((action, index) => {
      makeMainButton({
        id: `${phobiaId}-action-${index}`,
        label: action.label,
        color: action.color,
        position: MAIN_BUTTON_POSITIONS[index],
        onClick: action.onClick
      });
    });

    // Requirement: 1 little "go back to home" button on the phobia page.
    // (No music button here — phobia-page backgrounds never carry music.)
    makeCornerButton({
      id: `${phobiaId}-home-corner`,
      label: 'Home',
      position: CORNER_BUTTON_POSITION_SINGLE,
      color: CORNER_COLOR_HOME,
      onClick: renderHome
    });
  }

  function renderPhobiaScene(phobiaId, intensity) {
    const phobia = PHOBIAS[phobiaId];
    if (!phobia) return;
    const sceneData = phobia[intensity];
    if (!sceneData) return;
    const media = SCENE_MEDIA[sceneData.id];

    state.activeScene = sceneData.id;
    state.returnToPhobia = phobiaId;
    sceneLabel.textContent = `${phobia.name} — ${sceneData.name}`;
    clearHotspots();
    clearCornerButtons();
    setBackgroundFromScene(media);

    hotspotContainer.appendChild(addTextBlock({
      x: 0, y: 2.5, z: -2.7, width: 2.0,
      text: `${phobia.name}\n${sceneData.name}`
    }));

    // Requirement: 4 little side buttons — home, this phobia's page,
    // calm place 1, calm place 2.
    makeCornerButton({
      id: `${sceneData.id}-home`,
      label: 'Home',
      position: CORNER_BUTTON_POSITIONS_4[0],
      color: CORNER_COLOR_HOME,
      onClick: renderHome
    });
    makeCornerButton({
      id: `${sceneData.id}-phobia-page`,
      label: phobia.name,
      position: CORNER_BUTTON_POSITIONS_4[1],
      color: CORNER_COLOR_PHOBIA_PAGE,
      onClick: () => renderPhobiaPage(phobiaId)
    });
    makeCornerButton({
      id: `${sceneData.id}-calm-1`,
      label: CALM_PLACES[phobia.calm1].name,
      position: CORNER_BUTTON_POSITIONS_4[2],
      color: CORNER_COLOR_CALM_1,
      onClick: () => renderCalmScene(phobia.calm1, phobiaId)
    });
    makeCornerButton({
      id: `${sceneData.id}-calm-2`,
      label: CALM_PLACES[phobia.calm2].name,
      position: CORNER_BUTTON_POSITIONS_4[3],
      color: CORNER_COLOR_CALM_2,
      onClick: () => renderCalmScene(phobia.calm2, phobiaId)
    });

    // Music toggle — only shown when this scene actually has music.
    if (media && media.music) {
      makeMusicToggleButton({
        id: `${sceneData.id}-music-toggle`,
        position: musicButtonPositionNearHome4()
      });
    }
  }

  function renderCalmScene(calmId, fromPhobiaId) {
    const calm = CALM_PLACES[calmId];
    if (!calm) return;
    const returnPhobiaId = fromPhobiaId || state.returnToPhobia || PHOBIA_ORDER[0];
    const media = SCENE_MEDIA[calm.id];

    state.activeScene = calm.id;
    state.returnToPhobia = returnPhobiaId;
    sceneLabel.textContent = calm.name;
    clearHotspots();
    clearCornerButtons();
    setBackgroundFromScene(media);

    hotspotContainer.appendChild(addTextBlock({
      x: 0, y: 2.5, z: -2.7, width: 2.0,
      text: `${calm.name}\n${calm.info}`
    }));

    // Requirement: exactly 1 little button here — back to the phobia
    // page the user came from.
    const phobiaName = PHOBIAS[returnPhobiaId] ? PHOBIAS[returnPhobiaId].name : 'Phobia page';
    makeCornerButton({
      id: `${calm.id}-return-phobia`,
      label: `Back to ${phobiaName}`,
      position: CORNER_BUTTON_POSITION_SINGLE,
      color: CORNER_COLOR_BACK,
      onClick: () => renderPhobiaPage(returnPhobiaId)
    });

    // Music toggle — only shown when this calm scene actually has music.
    if (media && media.music) {
      makeMusicToggleButton({
        id: `${calm.id}-music-toggle`,
        position: musicButtonPositionNearSingle()
      });
    }
  }

  /* ======================================================================
   * OPTIONAL / EXPERIMENTAL: hardware volume-key hook
   *
   * Disabled by default. Most mobile browsers never fire these key
   * events for volume buttons at all (the OS reserves them for system
   * volume). Left here only in case you want to try it on a specific
   * device/browser combo during testing; do not rely on it. See
   * docs/DEVELOPER.md for details.
   * ==================================================================== */
  const ENABLE_EXPERIMENTAL_VOLUME_KEYS = false;

  if (ENABLE_EXPERIMENTAL_VOLUME_KEYS) {
    window.addEventListener('keydown', (event) => {
      if (event.key === 'AudioVolumeUp') {
        const homeBtn = document.querySelector('#corner-container a-plane.clickable');
        if (homeBtn) homeBtn.emit('click');
      }
    });
  }

  /* ======================================================================
   * INIT
   * ==================================================================== */

  document.querySelector('a-scene').addEventListener('loaded', () => {
    renderHome();
  });
</script>
</body>
</html>
